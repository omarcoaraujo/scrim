name: Check
on:
  workflow_dispatch:
  workflow_call:
  push:
  pull_request:
jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: stylua --check src cli tests

  cli:
    name: CLI specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pesde
        uses: axiom-co/setup-pesde@b690699ace34169731b6b2a1c93b2008472038a7
        with:
          token: ${{ github.token }}

      - name: Install CLI packages
        working-directory: cli
        run: pesde install

      - name: Run the CLI specs
        run: lune run tests/cli

  analyze:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pesde
        uses: axiom-co/setup-pesde@b690699ace34169731b6b2a1c93b2008472038a7
        with:
          token: ${{ github.token }}

      - name: Install CLI packages
        working-directory: cli
        run: pesde install

      - name: Generate Lune type definitions
        run: lune setup

      - name: Generate the sourcemap
        run: rojo sourcemap default.project.json --output sourcemap.json

      - name: Download the Roblox definitions
        run: curl -sL https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau -o globalTypes.d.luau

      - name: Type check
        run: luau-lsp analyze --definitions=globalTypes.d.luau --sourcemap=sourcemap.json --ignore "**/luau_packages/**" src cli
