name: Check
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: stylua --check src cli tests

  cli:
    name: CLI specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pesde
        run: |
          curl -sL "https://github.com/pesde-pkg/pesde/releases/download/v0.7.4%2Bregistry.0.2.3/pesde-0.7.4-linux-x86_64.zip" -o pesde.zip
          unzip -q pesde.zip -d "$HOME/.pesde/bin"
          chmod +x "$HOME/.pesde/bin/pesde"
          echo "$HOME/.pesde/bin" >> "$GITHUB_PATH"

      - name: Install CLI packages
        working-directory: cli
        run: pesde install

      - name: Run the CLI specs
        run: lune run tests/cli
