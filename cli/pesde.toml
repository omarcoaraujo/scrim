name = "omarcoaraujo/scrim_cli"
version = "0.1.1"
description = "Runner for scrim: builds the place, launches Studio and reports the result"
license = "MIT"
private = true
authors = ["omarcoaraujo <omarcoaraujo@outlook.com>"]
repository = "https://github.com/omarcoaraujo/scrim"
includes = ["pesde.toml", "lib/**/*", "main.luau"]

[target]
environment = "luau"
bin = "main.luau"

[indices]
default = "https://github.com/pesde-pkg/index"

[dependencies]
tint = { name = "omarcoaraujo/tint", version = "^0.1.1" }
